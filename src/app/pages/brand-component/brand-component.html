<div class="brand-page">

  <!-- Header -->
  <div class="page-header">
    <div class="header-left">
      <span class="label">MANAGEMENT</span>
      <h1>Brands <span class="accent">_</span></h1>
      <p class="subtitle">{{ brands.length }} brands registered</p>
    </div>
    <button class="btn-add" (click)="openForm()">
      <span class="plus">+</span> New Brand
    </button>
  </div>

  <!-- Form Panel -->
  <div class="form-panel" [class.open]="showForm">
    <div class="form-inner">
      <h3>{{ isEditing ? 'Edit Brand' : 'Create Brand' }}</h3>
      <div class="input-group">
        <input
          class="field"
          [(ngModel)]="form.name"
          placeholder="Brand name"
          (keyup.enter)="save()"
        />
        <span class="input-line"></span>
      </div>
      <div class="form-actions">
        <button class="btn-save" (click)="save()">
          {{ isEditing ? 'Update' : 'Create' }}
        </button>
        <button class="btn-cancel" (click)="reset()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Brand Grid -->
  <div class="brand-grid">
    <div
      class="brand-card"
      *ngFor="let brand of brands; let i = index"
      [style.animation-delay]="i * 60 + 'ms'"
    >
      <div class="card-number">{{ (i + 1).toString().padStart(2, '0') }}</div>
      <div class="card-body">
        <div class="brand-icon">{{ brand.name.charAt(0).toUpperCase() }}</div>
        <h4 class="brand-name">{{ brand.name }}</h4>
        <div class="brand-id">ID #{{ brand.id }}</div>
      </div>
      <div class="card-actions">
        <button class="btn-edit" (click)="edit(brand); openForm()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Edit
        </button>
        <button class="btn-delete" (click)="delete(brand.id!)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
          Delete
        </button>
      </div>
      <div class="card-glow"></div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="brands.length === 0">
      <div class="empty-icon">◈</div>
      <p>No brands yet. Create your first one.</p>
    </div>
  </div>

</div>
